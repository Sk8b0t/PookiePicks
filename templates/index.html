<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pookie-Picks</title>
    <!-- Cinematic Serif Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1a1a1a;
            --card-border: #2a2a2a;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            /* Gold Metallic Palette */
            --gold-bright: #ffe600;
            --gold-mid: #d4af37;
            --gold-dark: #aa771c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 620px;
            margin: 50px auto;
            padding: 20px;
        }

        /* VegaMovies-style Metallic Gold Title */
        h1 { 
            text-align: center; 
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #fff2a3 0%, #ffd700 40%, #caa12d 70%, #996515 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 15px rgba(255, 215, 0, 0.3);
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        form { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 35px; 
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            background: var(--card-bg);
            color: #fff;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--gold-mid);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        /* Gold Gradient Button */
        button {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            background: linear-gradient(135deg, #ffd700 0%, #caa12d 50%, #996515 100%);
            color: #0d0d0d;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        button:hover { 
            background: linear-gradient(135deg, #ffe033 0%, #d4af37 50%, #b37719 100%);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-1px);
        }

        h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        h3 span {
            color: var(--gold-bright);
        }

        ul { 
            list-style: none; 
            padding: 0; 
        }

        li {
            background: var(--card-bg);
            margin: 10px 0;
            padding: 14px 18px;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        li:hover {
            border-color: rgba(212, 175, 55, 0.4);
            background: #202020;
            transform: translateX(4px);
        }

        .movie-title {
            font-weight: 500;
            font-size: 0.98rem;
        }

        /* Golden Highlight Score */
        .score { 
            color: var(--gold-bright); 
            font-weight: 700;
            font-size: 0.9rem;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <h1>🎬 Movie Recommender</h1>

    <form method="POST" action="/">
        <input 
            type="text" 
            name="movie" 
            list="movie-options" 
            placeholder="Type or select a movie..." 
            value="{{ selected_movie if selected_movie else '' }}"
            required
            autocomplete="off"
        >
        
        <datalist id="movie-options">
            {% for movie in movie_list %}
                <option value="{{ movie }}">
            {% endfor %}
        </datalist>

        <button type="submit">Recommend</button>
    </form>

    {% if recommendations %}
        <h3>Top Recommendations for <span>"{{ selected_movie }}"</span>:</h3>
        <ul>
            {% for item in recommendations %}
                <li>
                    <span class="movie-title">{{ loop.index }}. {{ item.title }}</span>
                    <span class="score">{{ item.score }}</span>
                </li>
            {% endfor %}
        </ul>
    {% endif %}

</body>
</html>
